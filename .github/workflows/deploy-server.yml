name: Deploy Flask App (Server)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'flask-app/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch: # Allows manual triggering

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: ${{ secrets.GCP_REGION }}
  SERVICE_NAME: flaskr-app
  REGION: ${{ secrets.GCP_REGION }}

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker $GAR_LOCATION-docker.pkg.dev --quiet

      - name: Verify Cloud SQL access and permissions
        run: |-
          CONNECTION_NAME="${{ secrets.CLOUD_SQL_CONNECTION_NAME }}"
          if [ -z "$CONNECTION_NAME" ]; then
            echo "ERROR: CLOUD_SQL_CONNECTION_NAME secret is not set"
            exit 1
          fi
          
          # Parse connection name (format: project:region:instance)
          IFS=':' read -r PROJECT REGION INSTANCE <<< "$CONNECTION_NAME"
          
          echo "Verifying Cloud SQL access..."
          echo "Instance: $INSTANCE"
          echo "Project: $PROJECT"
          SA_EMAIL=$(gcloud config get-value account 2>/dev/null || echo "YOUR_SERVICE_ACCOUNT_EMAIL")
          echo "Service account: $SA_EMAIL"
          
          # Try to describe the instance to verify permissions
          if gcloud sql instances describe "$INSTANCE" --project="$PROJECT" >/dev/null 2>&1; then
            echo "✓ Cloud SQL access verified - service account has required permissions"
          else
            echo "❌ ERROR: Cannot access Cloud SQL instance"
            echo ""
            echo "The service account '$SA_EMAIL' needs the 'Cloud SQL Client' role."
            echo ""
            echo "To grant permissions, run:"
            echo "  gcloud projects add-iam-policy-binding $PROJECT \\"
            echo "    --member='serviceAccount:$SA_EMAIL' \\"
            echo "    --role='roles/cloudsql.client'"
            echo ""
            echo "Failing workflow to prevent tests from running with insufficient permissions."
            exit 1
          fi

      # Step 1: Test
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./flask-app
        run: |-
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Install application
        working-directory: ./flask-app
        run: pip install -e .

      - name: Create .env file from secrets
        working-directory: ./flask-app
        run: |-
          cat > .env << EOF
          FLASK_APP=flaskr
          FLASK_ENV=production
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          CLOUD_SQL_CONNECTION_NAME=${{ secrets.CLOUD_SQL_CONNECTION_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASS=${{ secrets.DB_PASS }}
          DB_NAME=${{ secrets.DB_NAME }}
          EOF
          echo ".env file created (secrets redacted in logs)"
          
      # Note: The service account in GCP_SA_KEY must have the following permissions:
      # - roles/cloudsql.client (or at minimum: cloudsql.instances.get)
      # This is required for the Cloud SQL Python Connector to query instance metadata
      # Grant with: gcloud projects add-iam-policy-binding PROJECT_ID --member="serviceAccount:SERVICE_ACCOUNT_EMAIL" --role="roles/cloudsql.client"

      - name: Run tests
        id: test
        working-directory: ./flask-app
        run: pytest tests/ -v

      # Step 2: Initialize database (must succeed before deployment)
      - name: Initialize database
        id: init-db
        working-directory: ./flask-app
        env:
          CLOUD_SQL_CONNECTION_NAME: ${{ secrets.CLOUD_SQL_CONNECTION_NAME }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
        run: |-
          echo "Initializing database tables..."
          echo ""
          echo "Database connection details:"
          echo "  CLOUD_SQL_CONNECTION_NAME: ${CLOUD_SQL_CONNECTION_NAME}"
          echo "  DB_NAME: ${DB_NAME}"
          echo "  DB_USER: ${DB_USER}"
          echo ""
          echo "Base64 encoded (for verification if values are masked above):"
          echo "  CLOUD_SQL_CONNECTION_NAME: $(echo -n '${CLOUD_SQL_CONNECTION_NAME}' | base64)"
          echo "  DB_NAME: $(echo -n '${DB_NAME}' | base64)"
          echo "  DB_USER: $(echo -n '${DB_USER}' | base64)"
          echo ""
          
          # Initialize database
          flask init-db
          
          # Verify tables were created by querying the database
          echo ""
          echo "Verifying tables were created..."
          python3 verify_db.py
          
          echo ""
          echo "✓ Database initialization completed"

      # Step 3: Build
      - name: Build and submit container image
        id: build
        working-directory: ./flask-app
        run: |-
          # Submit build asynchronously to avoid log streaming permission issues
          BUILD_ID=$(gcloud builds submit --async --tag $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/$SERVICE_NAME:$GITHUB_SHA --format="value(id)")
          echo "Build submitted with ID: $BUILD_ID"
          echo "View build logs at: https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=$PROJECT_ID"
          
          # Poll for build completion (doesn't require log streaming permissions)
          echo "Waiting for build to complete..."
          while true; do
            BUILD_STATUS=$(gcloud builds describe $BUILD_ID --project=$PROJECT_ID --format="value(status)" 2>/dev/null || echo "WORKING")
            echo "Build status: $BUILD_STATUS"
            
            if [ "$BUILD_STATUS" = "SUCCESS" ]; then
              echo "Build completed successfully!"
              break
            elif [ "$BUILD_STATUS" = "FAILURE" ] || [ "$BUILD_STATUS" = "CANCELLED" ] || [ "$BUILD_STATUS" = "EXPIRED" ] || [ "$BUILD_STATUS" = "TIMEOUT" ]; then
              echo "Build failed with status: $BUILD_STATUS"
              echo "View logs at: https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=$PROJECT_ID"
              exit 1
            fi
            
            sleep 5
          done

      # Step 4: Deploy (only runs if build, test, and database init succeed)
      - name: Deploy to Cloud Run
        id: deploy
        run: |-
          gcloud run deploy $SERVICE_NAME \
            --image $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/$SERVICE_NAME:$GITHUB_SHA \
            --platform managed \
            --region $REGION \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --add-cloudsql-instances ${{ secrets.CLOUD_SQL_CONNECTION_NAME }} \
            --set-env-vars "CLOUD_SQL_CONNECTION_NAME=${{ secrets.CLOUD_SQL_CONNECTION_NAME }},DB_USER=${{ secrets.DB_USER }},DB_PASS=${{ secrets.DB_PASS }},DB_NAME=${{ secrets.DB_NAME }},GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }},SECRET_KEY=${{ secrets.SECRET_KEY }}"

      - name: Show service URL
        run: |-
          gcloud run services describe $SERVICE_NAME \
            --platform managed \
            --region $REGION \
            --format 'value(status.url)'

