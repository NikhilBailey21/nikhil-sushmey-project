name: Deploy Report Maker (Worker)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'report-maker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch: # Allows manual triggering

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: ${{ secrets.GCP_REGION }}
  IMAGE_NAME: report-maker
  VM_NAME: report-maker-vm
  ZONE: ${{ secrets.GCP_ZONE || 'us-central1-a' }}
  REGION: ${{ secrets.GCP_REGION }}

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker $GAR_LOCATION-docker.pkg.dev --quiet

      # Step 1: Test (simple syntax check for report-maker)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test Python script syntax
        id: test
        working-directory: ./report-maker
        run: |-
          python -m py_compile mainConsumerScript.py
          echo "Syntax check passed!"

      # Step 2: Build
      - name: Build and submit container image
        id: build
        run: |-
          # Submit build asynchronously to avoid log streaming permission issues
          # Build from repo root to include shared directory
          IMAGE_URI="$GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/$IMAGE_NAME:$GITHUB_SHA"
          BUILD_ID=$(gcloud builds submit --async --config=report-maker/cloudbuild.yaml --substitutions=_IMAGE_URI=$IMAGE_URI --format="value(id)")
          echo "Build submitted with ID: $BUILD_ID"
          echo "View build logs at: https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=$PROJECT_ID"
          
          # Poll for build completion (doesn't require log streaming permissions)
          echo "Waiting for build to complete..."
          while true; do
            BUILD_STATUS=$(gcloud builds describe $BUILD_ID --project=$PROJECT_ID --format="value(status)" 2>/dev/null || echo "WORKING")
            echo "Build status: $BUILD_STATUS"
            
            if [ "$BUILD_STATUS" = "SUCCESS" ]; then
              echo "Build completed successfully!"
              break
            elif [ "$BUILD_STATUS" = "FAILURE" ] || [ "$BUILD_STATUS" = "CANCELLED" ] || [ "$BUILD_STATUS" = "EXPIRED" ] || [ "$BUILD_STATUS" = "TIMEOUT" ]; then
              echo "Build failed with status: $BUILD_STATUS"
              echo "View logs at: https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=$PROJECT_ID"
              exit 1
            fi
            
            sleep 5
          done

      # Step 3: Create or update Compute Engine VM instance
      - name: Create or update VM instance
        id: vm-setup
        run: |-
          IMAGE_URI="$GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/$IMAGE_NAME:$GITHUB_SHA"
          
          # Build environment variables for container - all secrets are required
          if [ -z "${{ secrets.RABBITMQ_HOST }}" ] || [ -z "${{ secrets.RABBITMQ_PORT }}" ] || [ -z "${{ secrets.RABBITMQ_USER }}" ] || [ -z "${{ secrets.RABBITMQ_PASS }}" ] || [ -z "${{ secrets.RABBITMQ_VHOST }}" ]; then
            echo "Error: All RabbitMQ secrets must be set: RABBITMQ_HOST, RABBITMQ_PORT, RABBITMQ_USER, RABBITMQ_PASS, RABBITMQ_VHOST"
            exit 1
          fi
          # Build environment variables as comma-separated KEY=VALUE pairs for metadata
          ENV_VARS="RABBITMQ_HOST=${{ secrets.RABBITMQ_HOST }},RABBITMQ_PORT=${{ secrets.RABBITMQ_PORT }},RABBITMQ_USER=${{ secrets.RABBITMQ_USER }},RABBITMQ_PASS=${{ secrets.RABBITMQ_PASS }},RABBITMQ_VHOST=${{ secrets.RABBITMQ_VHOST }}"
          
          # Also build ENV_ARGS in -e format for docker run command (used in startup script)
          ENV_ARGS="-e RABBITMQ_HOST=${{ secrets.RABBITMQ_HOST }}"
          ENV_ARGS="$ENV_ARGS -e RABBITMQ_PORT=${{ secrets.RABBITMQ_PORT }}"
          ENV_ARGS="$ENV_ARGS -e RABBITMQ_USER=${{ secrets.RABBITMQ_USER }}"
          ENV_ARGS="$ENV_ARGS -e RABBITMQ_PASS=${{ secrets.RABBITMQ_PASS }}"
          ENV_ARGS="$ENV_ARGS -e RABBITMQ_VHOST=${{ secrets.RABBITMQ_VHOST }}"
          
          # Check if VM exists
          if gcloud compute instances describe $VM_NAME --zone=$ZONE --project=$PROJECT_ID 2>/dev/null; then
            echo "VM instance '$VM_NAME' already exists"
            echo "vm_exists=true" >> $GITHUB_OUTPUT
          else
            echo "Creating VM instance '$VM_NAME'..."
            
            # Create startup script to authenticate Docker and run worker container
            # Note: COS already has Docker installed, so we just need to authenticate
            {
              echo '#!/bin/bash'
              echo '# Get image URI and env vars from metadata'
              echo 'IMAGE_URI=$(curl -s -H "Metadata-Flavor: Google" http://metadata.google.internal/computeMetadata/v1/instance/attributes/IMAGE_URI)'
              echo 'ENV_VARS=$(curl -s -H "Metadata-Flavor: Google" http://metadata.google.internal/computeMetadata/v1/instance/attributes/ENV_VARS)'
              echo 'GAR_LOC=$(echo $IMAGE_URI | cut -d/ -f1)'
              echo ''
              echo '# Authenticate Docker using service account token from metadata service'
              echo 'TOKEN_RESPONSE=$(curl -s -H "Metadata-Flavor: Google" "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token?scopes=https://www.googleapis.com/auth/cloud-platform")'
              echo 'ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | grep -o "\"access_token\":\"[^\"]*\"" | cut -d"\"" -f4)'
              echo ''
              echo 'if [ -n "$ACCESS_TOKEN" ]; then'
              echo '  echo "$ACCESS_TOKEN" | docker login -u oauth2accesstoken --password-stdin $GAR_LOC || true'
              echo 'fi'
              echo ''
              echo '# Pull and run worker container'
              echo 'docker pull $IMAGE_URI || true'
              echo ''
              echo '# Stop existing container if running'
              echo 'docker stop report-maker 2>/dev/null || true'
              echo 'docker rm report-maker 2>/dev/null || true'
              echo ''
              echo '# Parse environment variables and build docker run command'
              echo 'IFS="," read -ra ENV_ARRAY <<< "$ENV_VARS"'
              echo 'ENV_ARGS=""'
              echo 'for env_pair in "${ENV_ARRAY[@]}"; do'
              echo '  ENV_ARGS="$ENV_ARGS -e $env_pair"'
              echo 'done'
              echo ''
              echo '# Run worker container with Cloud Logging driver'
              echo 'PROJECT_ID=$(curl -s -H "Metadata-Flavor: Google" http://metadata.google.internal/computeMetadata/v1/project/project-id)'
              echo 'docker run -d \'
              echo '  --name report-maker \'
              echo '  --restart unless-stopped \'
              echo '  --log-driver=gcplogs \'
              echo '  --log-opt gcp-project=$PROJECT_ID \'
              echo '  --log-opt labels=container_name,report-maker \'
              echo '  $ENV_ARGS \'
              echo '  $IMAGE_URI'
            } > /tmp/startup-script.sh

            # Create VM without external IP (worker doesn't need external access)
            echo "Creating VM without external IP..."
            gcloud compute instances create $VM_NAME \
              --project=$PROJECT_ID \
              --zone=$ZONE \
              --machine-type=e2-small \
              --boot-disk-size=10GB \
              --boot-disk-type=pd-standard \
              --image-family=cos-stable \
              --image-project=cos-cloud \
              --metadata-from-file startup-script=/tmp/startup-script.sh \
              --metadata IMAGE_URI=$IMAGE_URI,ENV_VARS="$ENV_VARS" \
              --scopes=https://www.googleapis.com/auth/cloud-platform \
              --no-address
            
            echo "vm_exists=false" >> $GITHUB_OUTPUT
          fi

      # Step 4: Deploy container to VM using metadata update
      - name: Deploy worker container to VM
        run: |-
          IMAGE_URI="$GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/$IMAGE_NAME:$GITHUB_SHA"
          
          # Build environment variables for container - all secrets are required
          if [ -z "${{ secrets.RABBITMQ_HOST }}" ] || [ -z "${{ secrets.RABBITMQ_PORT }}" ] || [ -z "${{ secrets.RABBITMQ_USER }}" ] || [ -z "${{ secrets.RABBITMQ_PASS }}" ] || [ -z "${{ secrets.RABBITMQ_VHOST }}" ]; then
            echo "Error: All RabbitMQ secrets must be set: RABBITMQ_HOST, RABBITMQ_PORT, RABBITMQ_USER, RABBITMQ_PASS, RABBITMQ_VHOST"
            exit 1
          fi
          
          # Build environment variables as a single string for metadata
          ENV_VARS="RABBITMQ_HOST=${{ secrets.RABBITMQ_HOST }},RABBITMQ_PORT=${{ secrets.RABBITMQ_PORT }},RABBITMQ_USER=${{ secrets.RABBITMQ_USER }},RABBITMQ_PASS=${{ secrets.RABBITMQ_PASS }},RABBITMQ_VHOST=${{ secrets.RABBITMQ_VHOST }}"
          
          echo "Deploying worker container to VM via metadata update..."
          
          # Wait for VM to be ready (if it was just created)
          if [ "${{ steps.vm-setup.outputs.vm_exists }}" = "false" ]; then
            echo "Waiting for VM to be ready (startup script will deploy container)..."
            sleep 60  # Give startup script time to run
            echo "VM should be ready. Container should be deployed by startup script."
          else
            # For existing VMs, update metadata and deploy via SSH
            echo "Updating VM metadata with new image URI..."
            gcloud compute instances add-metadata $VM_NAME \
              --zone=$ZONE \
              --project=$PROJECT_ID \
              --metadata IMAGE_URI=$IMAGE_URI,ENV_VARS="$ENV_VARS",GAR_LOCATION=$GAR_LOCATION \
              --quiet
            
            # Check if VM has external IP
            HAD_EXTERNAL_IP=$(gcloud compute instances describe $VM_NAME \
              --zone=$ZONE \
              --project=$PROJECT_ID \
              --format='get(networkInterfaces[0].accessConfigs[0].natIP)' 2>/dev/null || echo "")
            
            if [ -z "$HAD_EXTERNAL_IP" ]; then
              # No external IP, temporarily add one for deployment
              echo "Temporarily adding external IP for deployment..."
              gcloud compute instances add-access-config $VM_NAME \
                --zone=$ZONE \
                --project=$PROJECT_ID \
                --access-config-name="external-nat" \
                --quiet
              
              # Wait for external IP to be assigned and SSH to be ready
              echo "Waiting for external IP and SSH to be ready..."
              sleep 30
            fi
            
            # Get external IP (should exist now)
            EXTERNAL_IP=$(gcloud compute instances describe $VM_NAME \
              --zone=$ZONE \
              --project=$PROJECT_ID \
              --format='get(networkInterfaces[0].accessConfigs[0].natIP)' 2>/dev/null || echo "")
            
            if [ -n "$EXTERNAL_IP" ]; then
              echo "Deploying container via SSH using external IP: $EXTERNAL_IP"
              
              # Deploy via SSH
              gcloud compute ssh $VM_NAME \
                --zone=$ZONE \
                --project=$PROJECT_ID \
                --command="
                  # Get image URI and env vars from metadata
                  IMAGE_URI=\$(curl -s -H \"Metadata-Flavor: Google\" http://metadata.google.internal/computeMetadata/v1/instance/attributes/IMAGE_URI)
                  ENV_VARS=\$(curl -s -H \"Metadata-Flavor: Google\" http://metadata.google.internal/computeMetadata/v1/instance/attributes/ENV_VARS)
                  GAR_LOC=\$(curl -s -H \"Metadata-Flavor: Google\" http://metadata.google.internal/computeMetadata/v1/instance/attributes/GAR_LOCATION)
                  
                  # Authenticate Docker using service account token from metadata service
                  # Get access token for Artifact Registry (parse JSON response)
                  TOKEN_RESPONSE=\$(curl -s -H \"Metadata-Flavor: Google\" \"http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token?scopes=https://www.googleapis.com/auth/cloud-platform\")
                  ACCESS_TOKEN=\$(echo \"\$TOKEN_RESPONSE\" | grep -o '\"access_token\":\"[^\"]*\"' | cut -d'\"' -f4)
                  
                  if [ -n \"\$ACCESS_TOKEN\" ]; then
                    # Configure Docker to use the access token
                    echo \"\$ACCESS_TOKEN\" | docker login -u oauth2accesstoken --password-stdin \$GAR_LOC-docker.pkg.dev
                  else
                    echo \"Failed to get access token from metadata service\"
                    echo \"Token response: \$TOKEN_RESPONSE\"
                    exit 1
                  fi
                  
                  # Pull latest image
                  docker pull \$IMAGE_URI
                  
                  # Stop existing container if running
                  docker stop report-maker 2>/dev/null || true
                  docker rm report-maker 2>/dev/null || true
                  
                  # Parse environment variables and build docker run command
                  IFS=\",\" read -ra ENV_ARRAY <<< \"\$ENV_VARS\"
                  ENV_ARGS=\"\"
                  for env_pair in \"\${ENV_ARRAY[@]}\"; do
                    ENV_ARGS=\"\$ENV_ARGS -e \$env_pair\"
                  done
                  
                  # Get project ID for Cloud Logging
                  PROJECT_ID=\$(curl -s -H \"Metadata-Flavor: Google\" http://metadata.google.internal/computeMetadata/v1/project/project-id)
                  
                  # Run worker container with environment variables and Cloud Logging driver
                  docker run -d \\
                    --name report-maker \\
                    --restart unless-stopped \\
                    --log-driver=gcplogs \\
                    --log-opt gcp-project=\$PROJECT_ID \\
                    --log-opt labels=container_name,report-maker \\
                    \$ENV_ARGS \\
                    \$IMAGE_URI
                  
                  # Verify container is running
                  sleep 5
                  if docker ps | grep -q report-maker; then
                    echo 'Worker container deployed successfully!'
                  else
                    echo 'ERROR: Container failed to start'
                    docker logs report-maker 2>&1 || true
                    exit 1
                  fi
                " \
                --quiet
              
              # Remove external IP if we added it (it was originally missing)
              if [ -z "$HAD_EXTERNAL_IP" ]; then
                echo "Removing temporary external IP after deployment..."
                gcloud compute instances delete-access-config $VM_NAME \
                  --zone=$ZONE \
                  --project=$PROJECT_ID \
                  --access-config-name="external-nat" \
                  --quiet || echo "Note: External IP removal failed (may have been pre-existing)"
              fi
            else
              echo "ERROR: Could not obtain external IP for deployment"
              echo "The VM metadata has been updated, but container deployment requires manual intervention."
              exit 1
            fi
          fi

      # Step 5: Show VM details
      - name: Show VM details
        run: |-
          INTERNAL_IP=$(gcloud compute instances describe $VM_NAME \
            --zone=$ZONE \
            --project=$PROJECT_ID \
            --format='get(networkInterfaces[0].networkIP)')
          
          echo "Report Maker Worker VM Details:"
          echo "  Instance Name: $VM_NAME"
          echo "  Zone: $ZONE"
          echo "  Internal IP: $INTERNAL_IP"
          echo ""
          echo "Worker Status:"
          echo "  Container: report-maker"
          echo "  Image: $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/$IMAGE_NAME:$GITHUB_SHA"
          echo ""
          echo "✓ Worker deployed and running!"

