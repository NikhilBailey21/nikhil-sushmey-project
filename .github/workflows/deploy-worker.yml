name: Deploy Report Maker (Worker)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'report-maker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch: # Allows manual triggering

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: ${{ secrets.GCP_REGION }}
  SERVICE_NAME: report-maker-app
  REGION: ${{ secrets.GCP_REGION }}

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker $GAR_LOCATION-docker.pkg.dev --quiet

      # Step 1: Test (simple syntax check for report-maker)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test Python script syntax
        id: test
        working-directory: ./report-maker
        run: |-
          python -m py_compile mainConsumerScript.py
          echo "Syntax check passed!"

      # Step 2: Build
      - name: Build and submit container image
        id: build
        working-directory: ./report-maker
        run: |-
          # Submit build asynchronously to avoid log streaming permission issues
          BUILD_ID=$(gcloud builds submit --async --tag $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/$SERVICE_NAME:$GITHUB_SHA --format="value(id)")
          echo "Build submitted with ID: $BUILD_ID"
          echo "View build logs at: https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=$PROJECT_ID"
          
          # Poll for build completion (doesn't require log streaming permissions)
          echo "Waiting for build to complete..."
          while true; do
            BUILD_STATUS=$(gcloud builds describe $BUILD_ID --project=$PROJECT_ID --format="value(status)" 2>/dev/null || echo "WORKING")
            echo "Build status: $BUILD_STATUS"
            
            if [ "$BUILD_STATUS" = "SUCCESS" ]; then
              echo "Build completed successfully!"
              break
            elif [ "$BUILD_STATUS" = "FAILURE" ] || [ "$BUILD_STATUS" = "CANCELLED" ] || [ "$BUILD_STATUS" = "EXPIRED" ] || [ "$BUILD_STATUS" = "TIMEOUT" ]; then
              echo "Build failed with status: $BUILD_STATUS"
              echo "View logs at: https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=$PROJECT_ID"
              exit 1
            fi
            
            sleep 5
          done

      # Step 3: Deploy (only runs if build and test succeed)
      - name: Deploy to Cloud Run
        id: deploy
        run: |-
          # Build environment variables string
          ENV_VARS=""
          
          # Add RabbitMQ config if secrets are set
          if [ -n "${{ secrets.RABBITMQ_HOST }}" ]; then
            ENV_VARS="RABBITMQ_HOST=${{ secrets.RABBITMQ_HOST }},RABBITMQ_PORT=${{ secrets.RABBITMQ_PORT || '5672' }},RABBITMQ_USER=${{ secrets.RABBITMQ_USER || 'admin' }},RABBITMQ_PASS=${{ secrets.RABBITMQ_PASS || 'admin' }},RABBITMQ_VHOST=${{ secrets.RABBITMQ_VHOST || '/' }}"
          fi
          
          # Deploy with or without env vars
          if [ -n "$ENV_VARS" ]; then
            gcloud run deploy $SERVICE_NAME \
              --image $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/$SERVICE_NAME:$GITHUB_SHA \
              --platform managed \
              --region $REGION \
              --allow-unauthenticated \
              --port 8080 \
              --memory 256Mi \
              --cpu 1 \
              --min-instances 0 \
              --max-instances 10 \
              --set-env-vars "$ENV_VARS"
          else
            gcloud run deploy $SERVICE_NAME \
              --image $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/$SERVICE_NAME:$GITHUB_SHA \
              --platform managed \
              --region $REGION \
              --allow-unauthenticated \
              --port 8080 \
              --memory 256Mi \
              --cpu 1 \
              --min-instances 0 \
              --max-instances 10
          fi

      - name: Show service URL
        run: |-
          gcloud run services describe $SERVICE_NAME \
            --platform managed \
            --region $REGION \
            --format 'value(status.url)'

