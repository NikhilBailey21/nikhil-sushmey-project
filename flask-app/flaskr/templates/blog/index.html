{% extends 'base.html' %}

{% block header %}
  <h1>{% block title %}Hello World{% endblock %}</h1>
{% endblock %}

{% block content %}
  <p>Welcome to Credit Card!</p>
  <h2>Upload CSV</h2>
    <form method="POST" action="/upload" enctype="multipart/form-data">
        <input type="file" name="file" accept=".csv">
        <button type="submit">Upload</button>
    </form>
{% endblock %}
