{% extends 'base.html' %}

{% block header %}
  <div class="row">
    <div class="col-md-8 col-lg-6 mx-auto">
      <h1 class="display-5 fw-bold text-center mb-4">{% block title %}Register{% endblock %}</h1>
    </div>
  </div>
{% endblock %}

{% block content %}
  <div class="row">
    <div class="col-md-8 col-lg-6 mx-auto">
      <div class="card shadow-sm">
        <div class="card-body p-5">
          <form method="post">
            <div class="mb-3">
              <label for="username" class="form-label fw-semibold">
                <i class="bi bi-person me-2"></i>Username
              </label>
              <input type="text" class="form-control form-control-lg" name="username" id="username" required>
            </div>
            <div class="mb-4">
              <label for="password" class="form-label fw-semibold">
                <i class="bi bi-lock me-2"></i>Password
              </label>
              <input type="password" class="form-control form-control-lg" name="password" id="password" required>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary btn-lg">
                <i class="bi bi-person-plus me-2"></i>Register
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
